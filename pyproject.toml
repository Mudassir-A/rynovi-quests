[project]
name = "rynovi-quests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohd Mudassir Ansari", email = "mudassirimranansari@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.0",
    "mcp>=1.10,<2",
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "pydantic>=2.6",
    "pytest>=8",
]

[project.scripts]
rynovi-quests = "rynovi_quests:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
